model:
  vocab_size: 50257
  block_size: 512
  n_layer: 12
  n_head: 12
  n_embd: 768
  mlp_ratio: 4
  bias: true
  dropout: 0.0
  tie_embeddings: true

data:
  root: data/tinystories_gpt2
  schedule_dir: protocol/batch_schedules
  initial_state_dir: protocol/initial_states

training:
  train_tokens: 500000000
  global_tokens_per_step: 131072
  micro_batch_size: 32
  precision: bf16
  learning_rate: 0.0005
  min_learning_rate: 0.00005
  warmup_tokens: 10000000
  betas: [0.9, 0.95]
  weight_decay: 0.1
  grad_clip: 1.0
  eval_every_steps: 100
  eval_tokens: 1048576
  checkpoint_every_steps: 500
  seed: 101
  compile: true
  strict_flash: true

prior:
  selected_programs: protocol/selected_programs.json
  initial_alpha: 0.1
  warmup_tokens: 10000000
  control_seed: 1729
  selection_count: 8
  max_per_layer: 2
  discovery_stories: 256
  discovery_batch_size: 2
