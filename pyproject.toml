[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "programmatic-attention"
version = "0.1.0"
description = "Four-arm GPT-2-small TinyStories pilot for programmatic attention priors"
requires-python = ">=3.11,<3.14"
dependencies = [
  "datasets>=4.0,<5",
  "huggingface-hub>=0.34,<2",
  "numpy>=2.0,<3",
  "pydantic>=2.11,<3",
  "pyyaml>=6.0,<7",
  "safetensors>=0.6,<1",
  "tiktoken>=0.11,<1",
  "torch==2.11.0",
]

[project.optional-dependencies]
analysis = ["matplotlib>=3.10,<4", "pandas>=2.3,<3", "scipy>=1.16,<2"]
test = ["pytest>=8.4,<10"]

[tool.hatch.build.targets.wheel]
packages = ["src/progattn"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
extend-exclude = ["*.md"]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["ANN", "B", "E", "F", "I", "PTH", "RUF", "SIM", "UP"]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["ANN201"]

[tool.ty.rules]
blanket-ignore-comment = "error"
missing-type-argument = "error"
possibly-unresolved-reference = "warn"
unsound-return-statement = "error"
unsound-yield = "error"
unsupported-dynamic-base = "warn"

[tool.ty.analysis]
strict-literal-narrowing = true
strict-generic-narrowing = true
